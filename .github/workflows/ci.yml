name: CI

# The exact same Docker Compose verification boundary used locally
# (`docker compose run --rm verify`) is the only gate here, so local and CI
# results cannot drift.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ruff + mypy + pytest via Docker Compose
        run: docker compose run --build --rm verify
      - name: Browser harness (headless Chromium) — secure + vulnerable contrast
        env:
          ALLOW_VULNERABLE_DEMO: "true"
        run: >-
          docker compose --profile harness --profile vulnerable
          run --build --rm harness
      - name: Comparison CLI — full three-axis contrast
        env:
          ALLOW_VULNERABLE_DEMO: "true"
        run: >-
          docker compose --profile harness --profile vulnerable
          run --rm harness python -m scriptjack.cli compare
