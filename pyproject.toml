[project]
name = "scriptjack"
version = "0.1.0"
description = "Educational, container-only demonstration of cross-site scripting (XSS / CWE-79) and its context-correct fix."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "nh3>=0.2.18",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptjack"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
# FastAPI's route decorators are intentionally permissive about the wrapped
# signature; the wrapped functions themselves remain fully typed.
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
