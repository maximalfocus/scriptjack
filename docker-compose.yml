# Docker Compose is the only supported host workflow. The host needs Docker only:
# no Python, no browser, and no installed project packages.
#
#   docker compose up secure-app                        # secure portal, 127.0.0.1:8000
#   docker compose run --rm verify                      # Ruff + mypy + pytest (unit)
#   ALLOW_VULNERABLE_DEMO=true \
#     docker compose --profile harness --profile vulnerable \
#     run --build --rm harness                          # full browser demo (secure + vulnerable)
#
# The secure application is the only default service. The vulnerable app, the
# browser harness (and, later, the collector) are opt-in behind profiles, so
# `docker compose up` never starts anything unsafe.

services:
  secure-app:
    build:
      context: .
      target: runtime
    image: scriptjack-secure:local
    networks: [demo, hostpub]
    ports:
      - "127.0.0.1:8000:8000" # loopback only
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: "no"

  # Intentionally vulnerable app. Opt-in only: it is behind the `vulnerable`
  # profile AND refuses to start unless ALLOW_VULNERABLE_DEMO=true is supplied
  # from the environment. Hardened per FR-018.
  vulnerable-app:
    build:
      context: .
      target: runtime
    image: scriptjack-secure:local
    profiles: ["vulnerable"]
    command:
      ["uvicorn", "scriptjack.vulnerable.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ALLOW_VULNERABLE_DEMO: "${ALLOW_VULNERABLE_DEMO:-}"
    networks: [demo, hostpub]
    ports:
      - "127.0.0.1:8001:8000" # loopback only
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: "no"

  # The attacker's in-network drop point. Opt-in with the vulnerable app, on the
  # egress-less network, hardened, and published on loopback 8002 only.
  collector:
    build:
      context: .
      target: runtime
    image: scriptjack-secure:local
    profiles: ["vulnerable"]
    command:
      ["uvicorn", "scriptjack.collector.app:app", "--host", "0.0.0.0", "--port", "8000"]
    networks: [demo, hostpub]
    ports:
      - "127.0.0.1:8002:8000" # loopback only
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: "no"

  verify:
    build:
      context: .
      target: dev
    image: scriptjack-verify:local
    profiles: ["verify"]
    # The one documented unit verification boundary, shared verbatim by CI.
    command:
      - sh
      - -c
      - "ruff check . && ruff format --check . && mypy && pytest"

  # Headless-Chromium (Playwright) harness. It is attached ONLY to the hermetic,
  # egress-less `demo` network, so the context in which injected script runs
  # cannot reach any external host — only the demo's own services.
  harness:
    build:
      context: .
      target: harness
    image: scriptjack-harness:local
    profiles: ["harness"]
    depends_on:
      secure-app:
        condition: service_healthy
      vulnerable-app:
        condition: service_healthy
      collector:
        condition: service_healthy
    environment:
      SCRIPTJACK_BASE_URL: "http://secure-app:8000"
      SCRIPTJACK_VULN_BASE_URL: "http://vulnerable-app:8000"
      SCRIPTJACK_COLLECTOR_URL: "http://collector:8000"
    networks: [demo]
    security_opt:
      - "no-new-privileges:true"
    command: ["pytest", "browser_tests"]

networks:
  # Hermetic, egress-less network for the attack path (harness <-> apps).
  demo:
    internal: true
  # A loopback-publish network so the app ports are reachable from the host for
  # manual exploration; the harness is deliberately not attached to it.
  hostpub:
    driver: bridge
